<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="92mm" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
<title id="title">Fig. 4-4 C2 Temporal-Continuity specialist</title>
<desc id="desc">Editable structural draft of a physical association persistence option with direct canonical r2 and an empirical-only EE endpoint.</desc>
<defs>
<marker id="dark" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
<path d="M0 0L12 6L0 12Z" fill="#24313A"/>
</marker>
<marker id="rust" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
<path d="M0 0L12 6L0 12Z" fill="#B44939"/>
</marker>
<marker id="teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
<path d="M0 0L12 6L0 12Z" fill="#1F7A78"/>
</marker>
</defs>
<rect id="background" width="1600" height="920" fill="#FBFAF6"/>
<g id="header" font-family="Noto Sans, sans-serif">
<rect id="fig-pill" x="54" y="38" width="155" height="46" rx="23" fill="#17324D"/>
<text x="81" y="70" font-size="25" font-weight="700" fill="#FBFAF6">FIG 4-4</text>
<text x="235" y="66" font-size="34" font-weight="700" fill="#24313A">C2 Temporal-Continuity specialist</text>
<text x="235" y="100" font-size="24" fill="#66727B">Physical-ID persistence option, unchanged canonical r₂, and empirical EE interaction only</text>
<rect id="draft-pill" x="1335" y="38" width="210" height="46" rx="23" fill="#EEF1F2" stroke="#66727B" stroke-width="2"/>
<text x="1362" y="70" font-size="24" font-weight="700" fill="#66727B">EDITABLE DRAFT</text>
</g>
<g id="carrier" font-family="Noto Sans, sans-serif">
<path d="M55 145H1517L1545 173V690H55Z" fill="#FFF9F3" stroke="#9B5E2E" stroke-width="4"/>
<path id="training-tab" d="M72 145H365V192H72Z" fill="#9B5E2E"/>
<text x="98" y="178" font-size="24" font-weight="700" fill="#FBFAF6">TRAINING-ONLY • C2 / F₂</text>
<text x="97" y="232" font-size="25" fill="#66727B">Q₂<tspan baseline-shift="super" font-size="24">F</tspan> retains complete executed bundles.</text>
</g>
<g id="state-machine" font-family="Noto Sans, sans-serif">
<rect id="trigger" x="88" y="328" width="176" height="105" rx="14" fill="#F7E9DD" stroke="#9B5E2E" stroke-width="4"/>
<text x="118" y="371" font-size="29" font-weight="700" fill="#9B5E2E">Trigger</text>
<text x="109" y="405" font-size="24" fill="#24313A">action-time state</text>
<path id="edge-trigger-bind" d="M268 380H356" fill="none" stroke="#24313A" stroke-width="5" marker-end="url(#dark)"/>
<path id="bind-physical-id" d="M371 301H652L677 326V433H371Z" fill="#E3F2F1" stroke="#1F7A78" stroke-width="4"/>
<text x="397" y="345" font-size="26" font-weight="700" fill="#1F7A78">bind physical association ID</text>
<text x="470" y="379" font-size="32" font-family="FreeSerif, serif" fill="#24313A">(s, v)</text>
<text x="397" y="412" font-size="24" fill="#66727B">not a candidate-table index</text>
<path id="edge-bind-hold" d="M682 380H758" fill="none" stroke="#24313A" stroke-width="5" marker-end="url(#dark)"/>
<rect id="hold" x="769" y="328" width="159" height="105" rx="14" fill="#E3F2F1" stroke="#1F7A78" stroke-width="4"/>
<text x="811" y="371" font-size="30" font-weight="700" fill="#1F7A78">Hold</text>
<text x="790" y="405" font-size="24" fill="#24313A">same (s, v)</text>
<path id="edge-hold-continue" d="M932 380H1009" fill="none" stroke="#24313A" stroke-width="5" marker-end="url(#dark)"/>
<rect id="continue" x="1020" y="328" width="178" height="105" rx="14" fill="#E3F2F1" stroke="#1F7A78" stroke-width="4"/>
<text x="1042" y="371" font-size="29" font-weight="700" fill="#1F7A78">Continue</text>
<text x="1043" y="405" font-size="20" fill="#24313A">re-check conditions</text>
<path id="edge-continue-loop" d="M1110 438C1110 495 848 495 848 438" fill="none" stroke="#24313A" stroke-width="5" marker-end="url(#dark)"/>
<text x="858" y="520" font-size="24" fill="#66727B">continue loop on the same bound physical ID</text>
<path id="edge-continue-terminate" d="M1202 380H1253" fill="none" stroke="#B44939" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#rust)"/>
<path id="early-terminate" d="M1267 301H1481L1505 325V433H1267Z" fill="#FFF1EE" stroke="#B44939" stroke-width="4"/>
<text x="1293" y="345" font-size="27" font-weight="700" fill="#B44939">Early terminate</text>
<text x="1293" y="375" font-size="19" fill="#24313A">invalid or infeasible</text>
<text x="1293" y="399" font-size="18" fill="#24313A">service / episode</text>
<text x="1293" y="423" font-size="18" fill="#24313A">or option end</text>
<rect id="release" x="1320" y="530" width="170" height="74" rx="14" fill="#EEF1F2" stroke="#24313A" stroke-width="3"/>
<text x="1356" y="576" font-size="29" font-weight="700" fill="#24313A">Release</text>
<path id="edge-normal-release" d="M1109 438C1112 493 1238 493 1262 520V566H1315" fill="none" stroke="#24313A" stroke-width="5" marker-end="url(#dark)"/>
<path id="edge-terminate-release" d="M1386 438V525" fill="none" stroke="#24313A" stroke-width="5" marker-end="url(#dark)"/>
</g>
<g id="endpoints" font-family="Noto Sans, sans-serif">
<rect id="r2-endpoint" x="91" y="549" width="432" height="80" rx="14" fill="#F7E9DD" stroke="#9B5E2E" stroke-width="4"/>
<text x="117" y="583" font-size="26" font-weight="700" fill="#9B5E2E">direct unchanged canonical r₂</text>
<text x="117" y="615" font-size="31" font-family="FreeSerif, serif" fill="#24313A">r₂,ᵤ(t) = −Ψᵤ(t)</text>
<path id="edge-hold-r2" d="M767 435C693 500 597 548 528 569" fill="none" stroke="#24313A" stroke-width="5" marker-end="url(#dark)"/>
<rect id="c2-update" x="608" y="549" width="255" height="80" rx="14" fill="#F7E9DD" stroke="#9B5E2E" stroke-width="3"/>
<text x="637" y="583" font-size="27" font-weight="700" fill="#9B5E2E">Q₂<tspan baseline-shift="super" font-size="24">F</tspan> update</text>
<text x="637" y="615" font-size="24" fill="#24313A">private r₂ view</text>
<path id="edge-r2-update" d="M527 589H603" fill="none" stroke="#66727B" stroke-width="3" stroke-dasharray="3 11" marker-end="url(#dark)"/>
<rect id="ee-endpoint" x="932" y="549" width="290" height="92" rx="14" fill="#E3F2F1" stroke="#1F7A78" stroke-width="3"/>
<text x="958" y="580" font-size="23" font-weight="700" fill="#1F7A78">empirical EE interaction</text>
<text x="958" y="609" font-size="20" fill="#24313A">association / service</text>
<text x="958" y="634" font-size="20" fill="#24313A">rate / power</text>
<path id="edge-empirical-ee" d="M1110 438V544" fill="none" stroke="#1F7A78" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#teal)"/>
<text x="930" y="676" font-size="22" fill="#1F7A78">dashed interaction only · no guaranteed EE gain</text>
</g>
<g id="line-key" font-family="Noto Sans, sans-serif">
<rect x="55" y="747" width="1490" height="117" rx="16" fill="#EEF1F2" stroke="#66727B" stroke-width="2"/>
<text x="81" y="790" font-size="24" font-weight="700" fill="#24313A">Line key</text>
<path d="M199 782H274" stroke="#24313A" stroke-width="5" marker-end="url(#dark)"/>
<text x="289" y="790" font-size="24" fill="#24313A">executed progression</text>
<path d="M580 782H655" stroke="#B44939" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#rust)"/>
<text x="670" y="790" font-size="24" fill="#24313A">conditional termination</text>
<path d="M1051 782H1126" stroke="#1F7A78" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#teal)"/>
<text x="1141" y="790" font-size="24" fill="#24313A">empirical interaction</text>
<path d="M199 838H274" stroke="#66727B" stroke-width="3" stroke-dasharray="3 11"/>
<text x="289" y="846" font-size="24" fill="#24313A">parameter / update relation</text>
<text x="741" y="846" font-size="24" fill="#66727B">Schematic only; geometry does not encode duration or effect size.</text>
</g>
</svg>
