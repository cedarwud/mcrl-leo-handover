<title id="svg-title">Fig. 4-1 Proposed SMC-ER method overview</title>
<desc id="svg-desc">Three training-only specialists create complete executed bundles. The Main-consumer gate precedes Main replay, the C3 path remains conditional and shadow-only on gate failure, and only Main reaches evaluation or deployment.</desc>

