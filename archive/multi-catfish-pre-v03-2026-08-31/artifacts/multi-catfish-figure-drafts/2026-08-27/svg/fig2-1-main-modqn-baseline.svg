<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="92mm" viewBox="0 0 1600 920" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Fig. 2-1 MODQN baseline substrate</title>
<desc id="svg-desc">A symbol-free Chapter 2 science card showing masked feasible-beam selection, three objective value networks, complete-transition replay, objective-wise target maxima, and independent target-network copies. It contains no SMC-ER mechanism.</desc>

<defs>
  <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#24313A"/></marker>
  <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#17324D"/></marker>
  <marker id="arrow-ochre" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#9B5E2E"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#1F7A78"/></marker>
  <marker id="arrow-rust" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#B44939"/></marker>
</defs>

