<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 424" width="148.26mm" height="51.53mm">
  <rect id="canvas-bg" x="0" y="0" width="1220" height="424" fill="#ffffff"/>
  <g id="layer-edges">
    <g id="e-occ-chi">
      <path d="M 382 77 L 464 77 L 464 212 L 485 212" fill="none" stroke="#333941" stroke-width="1.5"/>
      <polygon points="494,212 485,216.5 485,207.5" fill="#333941"/>
    </g>
    <g id="e-cont-chi">
      <path d="M 370 212 L 485 212" fill="none" stroke="#333941" stroke-width="1.5"/>
      <polygon points="494,212 485,216.5 485,207.5" fill="#333941"/>
    </g>
    <g id="e-rank-chi">
      <path d="M 386 347 L 464 347 L 464 212 L 485 212" fill="none" stroke="#333941" stroke-width="1.5"/>
      <polygon points="494,212 485,216.5 485,207.5" fill="#333941"/>
