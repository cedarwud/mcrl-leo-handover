      <text x="1065" y="205.76" font-family="Times New Roman, Times, serif" font-size="24" fill="#000000" text-anchor="middle"><tspan x="1065">Augmented state</tspan><tspan x="1065" dy="28.8"><tspan>[</tspan><tspan font-style="italic">s</tspan><tspan font-style="italic" baseline-shift="sub" font-size="16.8">u</tspan><tspan>, χ</tspan><tspan font-style="italic" baseline-shift="sub" font-size="16.8">u</tspan><tspan>]</tspan></tspan></text>
