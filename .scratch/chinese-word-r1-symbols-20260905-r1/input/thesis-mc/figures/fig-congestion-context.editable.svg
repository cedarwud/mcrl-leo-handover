    </g>
    <g id="chi">
      <rect x="494" y="159" width="326" height="106" rx="3" fill="#f3efe6" stroke="#2f5d80" stroke-width="2.5"/>
      <text x="657" y="205.76" font-family="Times New Roman, Times, serif" font-size="24" fill="#000000" text-anchor="middle"><tspan x="657"><tspan>Congestion</tspan><tspan> </tspan><tspan>context</tspan><tspan> χ</tspan><tspan font-style="italic" baseline-shift="sub" font-size="16.8">u</tspan></tspan><tspan x="657" dy="28.8">three per-beam values</tspan></text>
    </g>
    <g id="base">
      <rect x="947" y="24" width="236" height="78" rx="3" fill="#ffffff" stroke="#2f5d80" stroke-width="1.5"/>
      <text x="1065" y="71.16" font-family="Times New Roman, Times, serif" font-size="24" fill="#000000" text-anchor="middle"><tspan x="1065"><tspan>Base</tspan><tspan> </tspan><tspan>state</tspan><tspan> </tspan><tspan font-style="italic">s</tspan><tspan font-style="italic" baseline-shift="sub" font-size="16.8">u</tspan></tspan></text>
    </g>
    <g id="aug">
