      <text x="203" y="70.76" font-family="Times New Roman, Times, serif" font-size="24" fill="#000000" text-anchor="middle"><tspan x="203">Prior occupancy</tspan><tspan x="203" dy="28.8">last-step users on the beam</tspan></text>
    </g>
    <g id="cont">
      <rect x="24" y="159" width="346" height="106" rx="3" fill="#f3efe6" stroke="#2f5d80" stroke-width="1.5"/>
      <text x="197" y="205.76" font-family="Times New Roman, Times, serif" font-size="24" fill="#000000" text-anchor="middle"><tspan x="197">Contender count</tspan><tspan x="197" dy="28.8">users choosing it this step</tspan></text>
    </g>
    <g id="rank">
      <rect x="24" y="294" width="362" height="106" rx="3" fill="#f3efe6" stroke="#2f5d80" stroke-width="1.5"/>
