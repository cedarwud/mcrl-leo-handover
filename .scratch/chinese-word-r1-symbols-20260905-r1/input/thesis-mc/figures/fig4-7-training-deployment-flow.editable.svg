    </g>
    <g id="train">
      <rect x="24" y="489" width="1360" height="395" rx="4" fill="#ffffff" stroke="#78818a" stroke-width="1.5" stroke-dasharray="7 5"/>
      <text x="36" y="517" font-family="Times New Roman, Times, serif" font-size="22" fill="#000000" text-anchor="start">Training only</text>
    </g>
  </g>
  <g id="layer-edges">
