    </g>
    <g id="norm">
      <rect x="513" y="94" width="316" height="106" rx="3" fill="#f3efe6" stroke="#2f5d80" stroke-width="1.5"/>
      <text x="671" y="140.76" font-family="Times New Roman, Times, serif" font-size="24" fill="#000000" text-anchor="middle"><tspan x="671">Context normalization</tspan><tspan x="671" dy="28.8"><tspan>network</tspan><tspan> </tspan><tspan>input</tspan><tspan> </tspan><tspan font-style="italic">s</tspan><tspan>̃</tspan><tspan font-style="italic" baseline-shift="sub" font-size="16.8">u</tspan></tspan></text>
    </g>
    <g id="value">
      <rect x="983" y="94" width="370" height="106" rx="3" fill="#ffffff" stroke="#2f5d80" stroke-width="1.5"/>
      <text x="1168" y="140.76" font-family="Times New Roman, Times, serif" font-size="24" fill="#000000" text-anchor="middle"><tspan x="1168">Three objective Q-networks</tspan><tspan x="1168" dy="28.8"><tspan>combined</tspan><tspan> </tspan><tspan>value</tspan><tspan> </tspan><tspan font-style="italic">b</tspan><tspan font-style="italic" baseline-shift="sub" font-size="16.8">u</tspan><tspan>(</tspan><tspan font-style="italic">a</tspan><tspan>)</tspan></tspan></text>
    </g>
    <g id="act">
      <rect x="505" y="284" width="332" height="106" rx="3" fill="#ffffff" stroke="#2f5d80" stroke-width="1.5"/>
      <text x="671" y="330.76" font-family="Times New Roman, Times, serif" font-size="24" fill="#000000" text-anchor="middle"><tspan x="671">Per-user arg max</tspan><tspan x="671" dy="28.8">ε-greedy during training</tspan></text>
    </g>
    <g id="env">
      <rect x="44" y="284" width="368" height="106" rx="3" fill="#ffffff" stroke="#2f5d80" stroke-width="1.5"/>
      <text x="228" y="330.76" font-family="Times New Roman, Times, serif" font-size="24" fill="#000000" text-anchor="middle"><tspan x="228">Environment</tspan><tspan x="228" dy="28.8"><tspan>lights</tspan><tspan> </tspan><tspan>at</tspan><tspan> </tspan><tspan>most</tspan><tspan> </tspan><tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="16.8">max</tspan><tspan> </tspan><tspan>beams</tspan></tspan></text>
    </g>
    <g id="route">
      <rect x="69" y="644" width="318" height="106" rx="3" fill="#f3efe6" stroke="#8a5740" stroke-width="1.5"/>
      <text x="228" y="690.76" font-family="Times New Roman, Times, serif" font-size="24" fill="#000000" text-anchor="middle"><tspan x="228">Stratified routing</tspan><tspan x="228" dy="28.8">into two replay buffers</tspan></text>
    </g>
    <g id="upd_main">
      <rect x="544" y="544" width="278" height="106" rx="3" fill="#ffffff" stroke="#2f5d80" stroke-width="1.5"/>
      <text x="683" y="590.76" font-family="Times New Roman, Times, serif" font-size="24" fill="#000000" text-anchor="middle"><tspan x="683">Main agent update</tspan><tspan x="683" dy="28.8"><tspan>discount</tspan><tspan> β</tspan><tspan font-style="italic" baseline-shift="sub" font-size="16.8">M</tspan></tspan></text>
    </g>
    <g id="upd_cf">
      <rect x="544" y="744" width="312" height="106" rx="3" fill="#f3efe6" stroke="#8a5740" stroke-width="1.5"/>
      <text x="700" y="790.76" font-family="Times New Roman, Times, serif" font-size="24" fill="#000000" text-anchor="middle"><tspan x="700">Catfish role update</tspan><tspan x="700" dy="28.8"><tspan>discount</tspan><tspan> β</tspan><tspan baseline-shift="sub" font-size="16.8">CF</tspan><tspan> &gt; β</tspan><tspan font-style="italic" baseline-shift="sub" font-size="16.8">M</tspan></tspan></text>
    </g>
    <g id="interv">
