<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1408 908" width="171.11mm" height="110.35mm">
  <rect id="canvas-bg" x="0" y="0" width="1408" height="908" fill="#ffffff"/>
  <g id="layer-sections">
    <g id="loop">
      <rect x="24" y="24" width="1360" height="420" rx="4" fill="#ffffff" stroke="#78818a" stroke-width="1.5"/>
