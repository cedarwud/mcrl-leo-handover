    </g>
    <g id="lcap">
      <rect x="864" y="744" width="318" height="106" rx="3" fill="#f3efe6" stroke="#8a5740" stroke-width="1.5"/>
      <text x="1023" y="790.76" font-family="Times New Roman, Times, serif" font-size="24" fill="#000000" text-anchor="middle"><tspan x="1023"><tspan>Penalty</tspan><tspan> </tspan><tspan>shaping</tspan><tspan> </tspan><tspan font-style="italic">L</tspan><tspan baseline-shift="sub" font-size="16.8">cap</tspan></tspan><tspan x="1023" dy="28.8">added to the main loss</tspan></text>
    </g>
