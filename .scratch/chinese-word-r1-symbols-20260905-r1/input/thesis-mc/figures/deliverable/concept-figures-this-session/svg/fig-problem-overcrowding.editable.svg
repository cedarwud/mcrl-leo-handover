<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1408 673" width="171.11mm" height="81.79mm">
  <rect id="canvas-bg" x="0" y="0" width="1408" height="673" fill="#ffffff"/>
  <g id="layer-sections">
    <g id="crowd">
      <rect x="24" y="24" width="1360" height="290" rx="4" fill="#ffffff" stroke="#78818a" stroke-width="1.5"/>
      <text x="36" y="52" font-family="Times New Roman, Times, serif" font-size="22" fill="#000000" text-anchor="start">Same-beam crowding: bandwidth is shared</text>
    </g>
    <g id="cap">
      <rect x="24" y="359" width="1360" height="290" rx="4" fill="#ffffff" stroke="#78818a" stroke-width="1.5"/>
      <text x="36" y="387" font-family="Times New Roman, Times, serif" font-size="22" fill="#000000" text-anchor="start">More distinct beams than a satellite can light</text>
    </g>
  </g>
  <g id="layer-edges">
    <g id="e-a_pick-a_same">
      <path d="M 394 167 L 549 167" fill="none" stroke="#333941" stroke-width="1.5"/>
      <polygon points="558,167 549,171.5 549,162.5" fill="#333941"/>
    </g>
    <g id="e-a_same-a_harm">
      <path d="M 842 167 L 997 167" fill="none" stroke="#333941" stroke-width="1.5"/>
      <polygon points="1006,167 997,171.5 997,162.5" fill="#333941"/>
    </g>
    <g id="e-b_spread-b_gate">
      <path d="M 414 502 L 573 502" fill="none" stroke="#333941" stroke-width="1.5"/>
      <polygon points="582,502 573,506.5 573,497.5" fill="#333941"/>
    </g>
    <g id="e-b_gate-b_harm">
      <path d="M 868 502 L 1027 502" fill="none" stroke="#333941" stroke-width="1.5"/>
      <polygon points="1036,502 1027,506.5 1027,497.5" fill="#333941"/>
    </g>
  </g>
  <g id="layer-nodes">
    <g id="a_pick">
      <rect x="54" y="114" width="340" height="106" rx="3" fill="#ffffff" stroke="#2f5d80" stroke-width="1.5"/>
      <text x="224" y="160.76" font-family="Times New Roman, Times, serif" font-size="24" fill="#000000" text-anchor="middle"><tspan x="224">Users with similar inputs</tspan><tspan x="224" dy="28.8">each take arg max</tspan></text>
    </g>
    <g id="a_same">
      <rect x="558" y="114" width="284" height="106" rx="3" fill="#ffffff" stroke="#2f5d80" stroke-width="1.5"/>
      <text x="700" y="160.76" font-family="Times New Roman, Times, serif" font-size="24" fill="#000000" text-anchor="middle"><tspan x="700">Several can choose</tspan><tspan x="700" dy="28.8">the same beam</tspan></text>
    </g>
    <g id="a_harm">
      <rect x="1006" y="114" width="348" height="106" rx="3" fill="#ffffff" stroke="#2f5d80" stroke-width="2.5"/>
      <text x="1180" y="160.76" font-family="Times New Roman, Times, serif" font-size="24" fill="#000000" text-anchor="middle"><tspan x="1180">Bandwidth is shared</tspan><tspan x="1180" dy="28.8">throughput per user drops</tspan></text>
    </g>
    <g id="b_spread">
      <rect x="54" y="449" width="360" height="106" rx="3" fill="#ffffff" stroke="#2f5d80" stroke-width="1.5"/>
      <text x="234" y="495.76" font-family="Times New Roman, Times, serif" font-size="24" fill="#000000" text-anchor="middle"><tspan x="234">Users choose more distinct</tspan><tspan x="234" dy="28.8"><tspan>beams</tspan><tspan> </tspan><tspan>than</tspan><tspan> </tspan><tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="16.8">max</tspan></tspan></text>
    </g>
    <g id="b_gate">
      <rect x="582" y="449" width="286" height="106" rx="3" fill="#ffffff" stroke="#2f5d80" stroke-width="1.5"/>
      <text x="725" y="495.76" font-family="Times New Roman, Times, serif" font-size="24" fill="#000000" text-anchor="middle"><tspan x="725">Satellite lights only</tspan><tspan x="725" dy="28.8"><tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="16.8">max</tspan><tspan> </tspan><tspan>of</tspan><tspan> </tspan><tspan>them</tspan></tspan></text>
    </g>
    <g id="b_harm">
      <rect x="1036" y="449" width="318" height="106" rx="3" fill="#ffffff" stroke="#2f5d80" stroke-width="2.5"/>
      <text x="1195" y="495.76" font-family="Times New Roman, Times, serif" font-size="24" fill="#000000" text-anchor="middle"><tspan x="1195">Users on unlit beams</tspan><tspan x="1195" dy="28.8">get no service this step</tspan></text>
    </g>
  </g>
</svg>
