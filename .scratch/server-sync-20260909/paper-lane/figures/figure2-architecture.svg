<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1098" width="1600" height="1098">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1D4ED8" />
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#D97706" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669" />
    </marker>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1E293B" />
    </marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7C3AED" />
    </marker>
  </defs>
  <style>
    .font-title { font-family: 'Times New Roman', serif; font-size: 28px; font-weight: bold; fill: #0F172A; }
    .font-section { font-family: 'Times New Roman', serif; font-size: 24px; font-weight: bold; fill: #003366; }
    .font-box-title { font-family: 'Times New Roman', serif; font-size: 20px; font-weight: bold; }
    .font-box-body { font-family: 'Times New Roman', serif; font-size: 20px; fill: #1E293B; }
    .font-box-sub { font-family: 'Times New Roman', serif; font-size: 20px; fill: #475569; }
    .font-badge { font-family: 'Times New Roman', serif; font-size: 20px; font-weight: bold; }
  </style>
  <rect x="0" y="0" width="1600" height="1098" fill="url(#bgGrad)"/>
  <rect x="30" y="15" width="1540" height="80" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="48" class="font-title">Multi-Catfish MCRL V0.25: Successor Decision Path</text>
  <text x="50" y="76" class="font-box-sub">World Tape  •  Two Per-User Heads  •  Set-Level Coordinator over a Bounded Catalogue  •  Atomic Commit  •  48-Boundary Endpoint</text>
  <rect x="909" y="24" width="163" height="34" rx="4" fill="#DEF7EC" stroke="#31C48D" stroke-width="1"/>
  <text x="990.5" y="47" class="font-badge" fill="#03543F" text-anchor="middle">PRIMARY: a-r0</text>
  <rect x="1084" y="24" width="298" height="34" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
  <text x="1233.0" y="47" class="font-badge" fill="#5B21B6" text-anchor="middle">ENDPOINT: 48 BOUNDARIES</text>
  <rect x="1380" y="24" width="170" height="34" rx="4" fill="#FFFBEB" stroke="#EAB308" stroke-width="1"/>
  <text x="1465.0" y="47" class="font-badge" fill="#854D0E" text-anchor="middle">PRE-SEALED</text>
  <rect x="30" y="108" width="995" height="80" rx="6" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="45" y="133" class="font-box-title" fill="#6D28D9">I_heads  —  per user i, per legal action</text>
  <text x="45" y="157" class="font-box-body">i's candidate nominal geometry • i's history • previous served set</text>
  <text x="45" y="179" class="font-box-body">excluding i (b⁻₋ᵢ)  •  no joint physics  •  one forward pass</text>
  <rect x="1075" y="108" width="495" height="80" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="1090" y="133" class="font-box-title" fill="#6D28D9">I_coordinator  —  per anchor</text>
  <text x="1090" y="157" class="font-box-body">global nominal geometry + beam cross gains</text>
  <text x="1090" y="179" class="font-box-body">all legal sets • b⁻ • a⁰ • 𝒞 • 𝓜</text>
  <line x1="1050" y1="102" x2="1050" y2="754" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="1041" y="438.0" class="font-badge" fill="#7C3AED" text-anchor="middle" transform="rotate(-90 1041 438.0)">INFORMATION BOUNDARY</text>
  <rect x="30" y="198" width="490" height="532" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="198" width="490" height="42" rx="10" fill="#F1F5F9"/>
  <text x="45" y="228" class="font-section" fill="#003366">1. World Tape and Per-User Rows</text>
  <rect x="45" y="248" width="460" height="132" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="60" y="274" class="font-box-title" fill="#1D4ED8">World Tape (built once per world)</text>
  <text x="60" y="302" class="font-box-body">33 steps × 48 boundaries at t + k(0.640 s)</text>
  <text x="60" y="330" class="font-box-body">Geometry, channel and cross gains precomputed</text>
  <text x="60" y="358" class="font-box-sub">Reused by every arm and every setting</text>
  <rect x="45" y="396" width="460" height="132" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="60" y="422" class="font-box-title" fill="#1D4ED8">Per-User Candidate Rows</text>
  <text x="60" y="450" class="font-box-body">28 association slots (4 satellites × 7 cells)</text>
  <text x="60" y="478" class="font-box-body">NO_OP legal exactly for an empty mask</text>
  <text x="60" y="506" class="font-box-sub">One row per user per legal action</text>
  <rect x="45" y="544" width="460" height="160" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="60" y="570" class="font-box-title" fill="#1D4ED8">Frozen Row Schemas</text>
  <text x="60" y="598" class="font-box-body">Q1: rate-target margin, required power / cap,</text>
  <text x="60" y="626" class="font-box-body">mode SE, occupancy excluding focal, angle, times</text>
  <text x="60" y="654" class="font-box-body">Q2: 22 fields; background b⁻₋ᵢ at decision time</text>
  <text x="60" y="682" class="font-box-sub">Nominal model only — realised fading is excluded</text>
  <rect x="555" y="198" width="470" height="532" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="555" y="198" width="470" height="42" rx="10" fill="#F1F5F9"/>
  <text x="570" y="228" class="font-section" fill="#003366">2. Two Heads → Per-User Proposal</text>
  <rect x="570" y="248" width="440" height="118" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="585" y="274" class="font-box-title" fill="#1D4ED8">Q₁ : Focal Opening Head</text>
  <text x="585" y="302" class="font-box-body">Pairwise zero-bootstrap regression</text>
  <text x="585" y="330" class="font-box-sub">Supervised surrogate, not a Bellman value</text>
  <rect x="570" y="378" width="440" height="118" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="585" y="404" class="font-box-title" fill="#B45309">Q₂ : Continuation / Forecast Head</text>
  <text x="585" y="432" class="font-box-body">Same training form, 22-field schema</text>
  <text x="585" y="460" class="font-box-sub">Certificate is forecast validity</text>
  <rect x="570" y="508" width="440" height="104" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="585" y="534" class="font-box-title" fill="#0F172A">Per-User Masked Argmax</text>
  <text x="585" y="562" class="font-box-body">argmax over 𝒜ᵤ⁺ of normalised Q₁ + Q₂</text>
  <text x="585" y="590" class="font-box-sub">One forward pass per candidate row</text>
  <rect x="570" y="624" width="440" height="104" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="585" y="650" class="font-box-title" fill="#15803D">a⁰ (BASE) — validated profile</text>
  <text x="585" y="678" class="font-box-body">Independent picks repaired into a legal profile</text>
  <text x="585" y="706" class="font-box-sub">Built BEFORE the coordinator's clock starts</text>
  <rect x="1075" y="198" width="495" height="532" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1075" y="198" width="495" height="42" rx="10" fill="#F1F5F9"/>
  <text x="1090" y="228" class="font-section" fill="#003366">3. Set-Level Layer over the Catalogue</text>
  <rect x="1090" y="248" width="465" height="156" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1105" y="274" class="font-box-title" fill="#15803D">Bounded Catalogue 𝒞  (≈ 1 200 rows)</text>
  <text x="1105" y="302" class="font-box-body">≤ 800 unilateral: top-8 options per user</text>
  <text x="1105" y="330" class="font-box-body">≤ 180 pairwise: top-10 users × top-2 options</text>
  <text x="1105" y="358" class="font-box-body">≈ 40 per-active-beam evacuation sets</text>
  <text x="1105" y="386" class="font-box-body">≤ 200 S0 proposals and evacuations</text>
  <rect x="1090" y="416" width="465" height="156" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <text x="1105" y="442" class="font-box-title" fill="#15803D">Set-Level Selectors</text>
  <text x="1105" y="470" class="font-box-body">S3  learned Ψ̂_θ(Z, a⁰, A, a_A), deployed</text>
  <text x="1105" y="498" class="font-box-body">     permutation-invariant, Ψ̂(∅) = Ψ̂({u}) = 0</text>
  <text x="1105" y="526" class="font-box-body">S0  the same selector with exact Ψ_A</text>
  <text x="1105" y="554" class="font-box-body">S_UNI  iterated exact unilateral comparator</text>
  <rect x="1090" y="584" width="465" height="140" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="1105" y="610" class="font-box-title" fill="#0F172A">Two-Stage Scoring</text>
  <text x="1105" y="638" class="font-box-body">Stage 1  C₁ + Ψ over all rows at k = 0</text>
  <text x="1105" y="666" class="font-box-body">Stage 2  C₂ continuation over the top M = 64</text>
  <text x="1105" y="694" class="font-box-sub">Select the argmax of the complete score</text>
  <rect x="1353" y="596" width="202" height="28" rx="4" fill="#FFFBEB" stroke="#EAB308" stroke-width="1"/>
  <text x="1454.0" y="619" class="font-badge" fill="#854D0E" text-anchor="middle">10 s • 4 WORKERS</text>
  <rect x="30" y="768" width="1540" height="200" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="768" width="1540" height="42" rx="10" fill="#F1F5F9"/>
  <text x="45" y="798" class="font-section" fill="#003366">4. Validation, Execution and the 48-Boundary Endpoint</text>
  <rect x="45" y="824" width="362" height="124" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="60" y="850" class="font-box-title" fill="#15803D">Validation</text>
  <text x="60" y="878" class="font-box-body">Joint legality and repair</text>
  <text x="60" y="906" class="font-box-body">Service guard: no served-count</text>
  <text x="60" y="934" class="font-box-body">decrease versus BASE</text>
  <rect x="427" y="824" width="362" height="124" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="442" y="850" class="font-box-title" fill="#15803D">Coupled Capped Solve</text>
  <text x="442" y="878" class="font-box-body">p ← min(p⁺, Γ(N₀W + I(p))/ĥ)</text>
  <text x="442" y="906" class="font-box-body">Unique capped fixed point;</text>
  <text x="442" y="934" class="font-box-body">CONVERGED / CONVERGED_SLOW</text>
  <rect x="809" y="824" width="362" height="124" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="824" y="850" class="font-box-title" fill="#0F172A">Atomic Commit</text>
  <text x="824" y="878" class="font-box-body">One complete profile committed</text>
  <text x="824" y="906" class="font-box-body">Never split into per-user</text>
  <text x="824" y="934" class="font-box-body">adoptions</text>
  <rect x="1191" y="824" width="362" height="124" rx="8" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
  <text x="1206" y="850" class="font-box-title" fill="#FFFFFF">48-Boundary Endpoint</text>
  <text x="1206" y="878" class="font-box-body" fill="#CBD5E1">Realised fading • 47 trapezoidal intervals</text>
  <text x="1206" y="906" class="font-box-body" fill="#CBD5E1">Pooled ΣB / ΣE  •  C₁ / C₂ / C₃ labels</text>
  <text x="1206" y="934" class="font-box-title" fill="#38BDF8">⟨結果待填⟩</text>
  <line x1="1181.0" y1="820" x2="1181.0" y2="954" stroke="#059669" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="1181.0" y="812" class="font-badge" fill="#059669" text-anchor="middle">NOMINAL → REALISED</text>
  <!-- lane 1 -> lane 2 -->
  <path d="M 520 314 L 537 314 L 537 307 L 555 307" fill="none" stroke="#1D4ED8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <path d="M 520 462 L 537 462 L 537 437 L 555 437" fill="none" stroke="#1D4ED8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <path d="M 520 624 L 537 624 L 537 560 L 555 560" fill="none" stroke="#1D4ED8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <!-- inside lane 2: heads -> argmax -> a0 -->
  <line x1="790" y1="496" x2="790" y2="508" stroke="#1E293B" stroke-width="2" marker-end="url(#arrowDark)"/>
  <line x1="790" y1="612" x2="790" y2="624" stroke="#1E293B" stroke-width="2" marker-end="url(#arrowDark)"/>
  <!-- lane 2 -> lane 3: a0 crosses the information boundary -->
  <path d="M 1010 676 L 1036 676 L 1036 326 L 1075 326" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrowViolet)"/>
  <text x="1028" y="704" class="font-badge" fill="#7C3AED" text-anchor="middle">a⁰</text>
  <!-- catalogue -> selectors -> scoring -->
  <line x1="1322" y1="404" x2="1322" y2="416" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="1322" y1="572" x2="1322" y2="584" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <!-- committed selection returns along the left margin to band 4 -->
  <path d="M 1322 724 L 1322 750 L 16 750 L 16 886.0 L 45 886.0" fill="none" stroke="#1E293B" stroke-width="2" marker-end="url(#arrowDark)"/>
  <text x="1150" y="744" class="font-box-sub" fill="#1E293B">selected profile</text>
  <!-- band 4 left-to-right -->
  <line x1="407" y1="886" x2="427" y2="886" stroke="#1E293B" stroke-width="2" marker-end="url(#arrowDark)"/>
  <line x1="789" y1="886" x2="809" y2="886" stroke="#1E293B" stroke-width="2" marker-end="url(#arrowDark)"/>
  <line x1="1171" y1="886" x2="1191" y2="886" stroke="#1E293B" stroke-width="2" marker-end="url(#arrowDark)"/>
  <!-- deadline / fallback path (crosses the return run at a right angle) -->
  <path d="M 700 728 L 700 800 L 990.0 800 L 990.0 824" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrowAmber)"/>
  <text x="712" y="794" class="font-box-body" fill="#B45309">deadline miss → commit the pre-validated a⁰ (counted in B and E)</text>
  <rect x="30" y="986" width="1540" height="82" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="1016" class="font-box-title" fill="#F8FAFC">Reading the boundaries:</text>
  <text x="240" y="1016" class="font-box-body" fill="#CBD5E1">violet dashed = information boundary (what each layer may see)   •   amber dashed = deadline / fallback path   •   green dashed = nominal → realised</text>
  <text x="50" y="1046" class="font-box-body" fill="#CBD5E1">Selection may be approximated (k = 0, top-M pruning, margin adjustment); the endpoint may not — every committed profile and every label is recomputed on all 48 boundaries with realised fading.</text>
</svg>
