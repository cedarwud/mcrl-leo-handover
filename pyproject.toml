[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcrl-leo-handover"
version = "0.1.0"
description = "Clean-rebuild baseline MODQN for LEO multi-beam handover (MCRL)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "sgp4>=2.23",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
train = ["torch>=2.2"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
